name: intelbrastech

x-app: &app
  image: intelbrastech-app:latest
  restart: unless-stopped
  env_file:
    - ../backend/.env
  volumes:
    - app_storage:/var/www/html/storage
  networks:
    - intelbrastech_net
  environment:
    DOCKER_MONITOR_URL: http://docker-proxy:2375
    NODE_EXPORTER_URL: http://node-exporter:9100
    INFRA_MONITOR_TIMEOUT: 3

services:
  app:
    <<: *app
    build:
      context: ..
      dockerfile: docker/php/Dockerfile.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue:
    <<: *app
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    <<: *app
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    build:
      context: ..
      dockerfile: docker/nginx/Dockerfile.backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - app_storage:/var/www/html/storage:ro
    depends_on:
      - app
    networks:
      - intelbrastech_net

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile.prod
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    networks:
      - intelbrastech_net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE obrigatorio}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME obrigatorio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD obrigatorio}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - intelbrastech_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD obrigatorio}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD obrigatorio}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - intelbrastech_net

  rabbitmq:
    image: rabbitmq:management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER obrigatorio}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?RABBITMQ_PASS obrigatorio}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - intelbrastech_net

  mailpit:
    image: ghcr.io/axllent/mailpit:v1.33.1
    restart: unless-stopped
    networks:
      - intelbrastech_net

  # Expõe ao ERP somente consultas GET previamente autorizadas da API Docker.
  # O socket nunca é montado no container da aplicação.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:3.4
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      INFO: 1
      PING: 1
      VERSION: 1
      POST: 0
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.10
    networks:
      - intelbrastech_net

  # Métricas somente-leitura do host Linux/KVM. Não publica portas na internet.
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($|/)
    pid: host
    uts: host
    volumes:
      - /:/host:ro,rslave
    read_only: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.20
    networks:
      - intelbrastech_net

networks:
  intelbrastech_net:
    driver: bridge

volumes:
  app_storage:
  postgres_data:
  redis_data:
  rabbitmq_data:
