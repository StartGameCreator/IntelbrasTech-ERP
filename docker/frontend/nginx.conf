server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Aplicações de mensagem não executam o JavaScript da SPA. Esta resposta
    # específica permite que o link público de abertura de chamado tenha uma
    # prévia própria ao ser compartilhado no WhatsApp ou em redes sociais.
    location ~ ^/atendimento/?$ {
        try_files /index.html =404;
        add_header Cache-Control "no-store";
        sub_filter_once off;
        sub_filter 'IntelbrasTech -Tecnologia e Energia' 'IntelbrasTech - Cadastro de Atendimento';
        sub_filter 'Tecnologia que transforma. Energia que impulsiona o futuro.' 'Abra seu chamado técnico e acompanhe orçamento, autorização e atendimento pela IntelbrasTech.';
        sub_filter 'https://intelbrastech.com.br/social/intelbrastech-compartilhamento.png?v=20261121-4' 'https://intelbrastech.com.br/social/intelbrastech-compartilhamento.png?v=atendimento-20261121-5';
        sub_filter 'https://intelbrastech.com.br/' 'https://intelbrastech.com.br/atendimento';
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
