version: '3.9'

# ============================================================
# IntelbrasTech ERP — Docker Compose
# Stack: Laravel 11 + Vue.js 3 + PostgreSQL + Redis + Nginx
# ============================================================

services:

  # ──────────────────────────────────────────
  # PHP-FPM / Laravel 11
  # ──────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: ./php/Dockerfile
    container_name: intelbrastech_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ../backend:/var/www/html
      - ./php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-intelbrastech}
      - DB_USERNAME=${DB_USERNAME:-erp_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - intelbrastech_net

  # ──────────────────────────────────────────
  # Queue Worker (processa NF-e, sync, etc)
  # ──────────────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: ./php/Dockerfile
    container_name: intelbrastech_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ../backend:/var/www/html
    depends_on:
      - app
      - redis
    networks:
      - intelbrastech_net

  # ──────────────────────────────────────────
  # Scheduler (crons do Laravel)
  # ──────────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: ./php/Dockerfile
    container_name: intelbrastech_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: >
      sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction
        sleep 60
      done"
    volumes:
      - ../backend:/var/www/html
    depends_on:
      - app
    networks:
      - intelbrastech_net

  # ──────────────────────────────────────────
  # Nginx — Reverse Proxy
  # ──────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: intelbrastech_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../backend:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - intelbrastech_net

  # ──────────────────────────────────────────
  # Frontend Vue.js 3 (dev mode)
  # ──────────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: intelbrastech_frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ../frontend:/app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost/api/v1
      - VITE_APP_NAME=IntelbrasTech ERP
    networks:
      - intelbrastech_net

  # ──────────────────────────────────────────
  # PostgreSQL 16
  # ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: intelbrastech_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-intelbrastech}
      POSTGRES_USER: ${DB_USERNAME:-erp_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      PGDATA: /data/postgres
    volumes:
      - postgres_data:/data/postgres
      - ../sql/001_schema_completo.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-erp_user} -d ${DB_DATABASE:-intelbrastech}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - intelbrastech_net

  # ──────────────────────────────────────────
  # Redis 7 (cache, filas, sessões)
  # ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: intelbrastech_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-secret} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - intelbrastech_net

  # ──────────────────────────────────────────
  # RabbitMQ (mensageria para integrações)
  # ──────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: intelbrastech_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-secret}
    ports:
      - "5672:5672"
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - intelbrastech_net

  # ──────────────────────────────────────────
  # MinIO (storage S3-compatível local)
  # ──────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: intelbrastech_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - intelbrastech_net

  # ──────────────────────────────────────────
  # Mailpit (email local para dev)
  # ──────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: intelbrastech_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - intelbrastech_net

# ──────────────────────────────────────────
# Networks
# ──────────────────────────────────────────
networks:
  intelbrastech_net:
    driver: bridge

# ──────────────────────────────────────────
# Volumes persistentes
# ──────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  minio_data:
    driver: local
  nginx_logs:
    driver: local
